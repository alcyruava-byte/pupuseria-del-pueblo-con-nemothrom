<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pupusería del Pueblo</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbe9c6;--bg2:#f6cf8f;--fg:#3a1f10;--card:#fff4dc;--red:#c42f22;--green:#2a7a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1a10;--bg2:#1d120a;--fg:#fbe9c6}}
:root[data-theme="dark"]{--bg:#2a1a10;--bg2:#1d120a;--fg:#fbe9c6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--fg);font-family:"Baloo 2","Trebuchet MS",sans-serif;background:radial-gradient(circle at 50% 0,var(--bg) 0,var(--bg2) 100%);display:flex;justify-content:center}
#game{width:100%;max-width:980px;padding:10px 10px 24px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 0 10px;flex-wrap:wrap}
.hud h1{margin:0;font-size:1.35rem;font-weight:800;letter-spacing:.2px}
.pill{background:var(--card);color:#3a1f10;border:3px solid #3a1f10;border-radius:999px;padding:2px 14px;font-weight:800;font-size:1.05rem;box-shadow:0 3px 0 #3a1f10}
.pills{display:flex;gap:8px;flex-wrap:wrap}
canvas{display:block;width:100%;aspect-ratio:960/760;border:4px solid #3a1f10;border-radius:18px;background:#8fd8f0;touch-action:manipulation;box-shadow:0 6px 0 #3a1f10}
#msg{min-height:2.6em;font-size:1.1rem;font-weight:700;padding:12px 4px 6px}
#leg{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:9px}
#leg button{font:inherit;font-weight:700;font-size:.98rem;line-height:1.1;color:#3a1f10;background:var(--card);border:3px solid #3a1f10;border-radius:14px;box-shadow:0 4px 0 #3a1f10;padding:8px 10px;cursor:pointer;display:flex;align-items:center;gap:9px;text-align:left;min-height:48px}
#leg button:active{transform:translateY(3px);box-shadow:0 1px 0 #3a1f10}
#leg i{width:22px;height:22px;border:3px solid #3a1f10;border-radius:50%;flex:none}
:focus-visible{outline:4px solid #2a7fc0;outline-offset:2px}
#intro{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:20px;z-index:5}
#intro div{background:var(--card);color:#3a1f10;border:4px solid #3a1f10;border-radius:22px;padding:24px 26px;max-width:420px;text-align:center;box-shadow:0 8px 0 #3a1f10;font-weight:700;line-height:1.4}
#intro h2{margin:0 0 8px;font-size:1.7rem;font-weight:800}
#intro button{font:inherit;font-weight:800;font-size:1.2rem;border:3px solid #3a1f10;border-radius:14px;background:var(--green);color:#fff;padding:10px 26px;cursor:pointer;box-shadow:0 4px 0 #3a1f10}
#alc{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:14px;z-index:6;overflow:auto}
#alc .box{background:var(--card);color:#3a1f10;border:4px solid #3a1f10;border-radius:22px;padding:20px 20px 22px;max-width:760px;width:100%;box-shadow:0 8px 0 #3a1f10;font-weight:700;margin:auto}
#alc h2{margin:0;font-size:1.7rem;font-weight:800}
#alc .sub{margin:2px 0 8px;opacity:.8}#alc .cash{margin:6px 0;font-size:1.15rem}#alc .hint{margin:6px 0 12px;font-size:.92rem;opacity:.85;font-weight:600}
#alc .big{font-size:2rem;font-weight:800;margin:10px 0;color:var(--red)}
#alc .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:14px}
#alc .card{background:#fff;border:3px solid #3a1f10;border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 3px 0 #3a1f10}
#alc .card.done{background:#e3f4df}
#alc .ct{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#alc .em{font-size:1.5rem}
#alc .rec{background:var(--red);color:#fff;border-radius:999px;font-size:.72rem;padding:1px 9px;font-weight:800}
#alc .cd{font-size:.95rem;font-weight:700}#alc .card button{margin-top:auto}
#alc .nb{height:12px;border:2px solid #3a1f10;border-radius:8px;background:#eadbc0;overflow:hidden}#alc .nb span{display:block;height:100%;background:linear-gradient(90deg,#f6c344,#e04030)}
#alc .nl{font-size:.8rem;font-weight:600}
#alc button{font:inherit;font-weight:800;border:3px solid #3a1f10;border-radius:12px;background:var(--green);color:#fff;padding:7px 12px;cursor:pointer;box-shadow:0 3px 0 #3a1f10;min-height:44px}
#alc button:disabled{background:#c9bba0;color:#6b5a44;cursor:not-allowed}
#alc .next{background:var(--red);font-size:1.15rem;padding:10px 22px}
.pill{font-family:inherit}button.pill{cursor:pointer}button.pill:active{transform:translateY(2px);box-shadow:0 1px 0 #3a1f10}
#menu{position:fixed;inset:0;z-index:8;display:grid;place-items:center;padding:16px;overflow:auto;background:#6fc8ee}
#menu #mbg{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;aspect-ratio:2/1}
#menu .shade{position:absolute;inset:0;background:linear-gradient(#0000,#2a140855)}
.mbox{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:460px;width:100%;text-align:center;color:#fff}
.sign{background:linear-gradient(#b0703a,#7a4a22);border:5px solid #3a1f10;border-radius:26px;padding:12px 32px 14px;box-shadow:0 8px 0 #3a1f10;display:flex;flex-direction:column;line-height:.95;transform:rotate(-1.5deg)}
.sign span{font-weight:800;font-size:clamp(2.2rem,9vw,3.6rem);color:#fff4dc;-webkit-text-stroke:2px #3a1f10;paint-order:stroke fill;text-shadow:0 4px 0 #3a1f10}
.sign span+span{color:#f6c344}
#mst{margin:0;background:#fff4dcee;color:#3a1f10;border:3px solid #3a1f10;border-radius:14px;padding:8px 14px;font-weight:700;font-size:.98rem}
.mb{font:inherit;font-weight:800;font-size:1.35rem;color:#fff;border:4px solid #3a1f10;border-radius:18px;padding:14px 20px;width:100%;cursor:pointer;box-shadow:0 6px 0 #3a1f10;min-height:60px}
.mb.green{background:#3f9a4f}.mb.blue{background:#2f78c4}.mb:active{transform:translateY(4px);box-shadow:0 2px 0 #3a1f10}
.credit{margin:0;font-size:.8rem;font-weight:700;text-shadow:0 1px 3px #000}
#alc .box.wide{max-width:1000px}
#alc .hh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
#alc .town{position:relative;border:4px solid #3a1f10;border-radius:16px;overflow:hidden;margin:8px 0;aspect-ratio:2/1;background:#8ab8cc}
#alc .town canvas{position:absolute;inset:0;width:100%;height:100%}
#alc .pin{position:absolute;transform:translate(-50%,-50%);padding:0;min-height:0;border:none;background:none;box-shadow:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:#3a1f10}
#alc .pin b{width:36px;height:36px;border-radius:50%;border:3px solid #3a1f10;display:grid;place-items:center;font-size:1.2rem;box-shadow:0 3px 0 #3a1f10;background:#e04030;color:#fff;animation:pul 1.4s infinite}
#alc .pin.ok b{background:#3f9a4f;animation:none}#alc .pin.sel b{outline:4px solid #f6c344;outline-offset:2px}
#alc .pin small{background:#fff4dc;border:2px solid #3a1f10;border-radius:999px;padding:0 8px;font-weight:800;font-size:.72rem;white-space:nowrap}
@keyframes pul{50%{transform:scale(1.14)}}
#alc .stats{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}#alc .stats span{background:#fff;border:3px solid #3a1f10;border-radius:999px;padding:2px 12px;font-size:.92rem}
#alc .stats .days{background:#f6c344}
#alc .detail{background:#fff;border:3px solid #3a1f10;border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;margin-bottom:12px;box-shadow:0 3px 0 #3a1f10}
#alc .detail p{margin:0;font-weight:600}#alc .rec.ok{background:#3f9a4f}
#alc .hh button{min-height:40px;padding:4px 12px;white-space:nowrap}
.mwrap{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 36px;width:100%;max-width:900px}
.mleft{display:flex;flex-direction:column;align-items:stretch;gap:12px;width:min(440px,100%);text-align:center}
.mleft .sign{align-self:center;animation:sbob 3s ease-in-out infinite}
@keyframes sbob{0%,100%{transform:rotate(-1.5deg) translateY(0)}50%{transform:rotate(1deg) translateY(-6px)}}
.mb small{display:block;font-size:.8rem;font-weight:700;opacity:.9;margin-top:2px}
.mb.orange{background:#e8892a}.mb.purple{background:#7b4cc4}.two{display:flex;gap:10px}.two .mb{font-size:1.05rem;padding:10px 8px;min-height:52px}
#mas,#menu #mbg{border:none;border-radius:0;box-shadow:none;background:none}#mas{width:min(300px,56vw);height:auto;aspect-ratio:1}
#menu .credit{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#fff}
#info{position:fixed;inset:0;z-index:10;display:none;place-items:center;padding:16px;background:#000b}
#info .box{background:var(--card);color:#3a1f10;border:4px solid #3a1f10;border-radius:22px;padding:22px;max-width:480px;font-weight:700;box-shadow:0 8px 0 #3a1f10;line-height:1.45}
#info h2{margin:0 0 8px}#info p{margin:6px 0}
#info .next{font:inherit;font-weight:800;font-size:1.1rem;border:3px solid #3a1f10;border-radius:14px;background:var(--red);color:#fff;padding:9px 22px;cursor:pointer;box-shadow:0 4px 0 #3a1f10;margin-top:8px}
#end{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:20px}
#end div{background:var(--card);color:#3a1f10;border:4px solid #3a1f10;border-radius:22px;padding:26px 28px;max-width:360px;text-align:center;box-shadow:0 8px 0 #3a1f10;font-weight:700;font-size:1.1rem;line-height:1.4}
#end h2{margin:0 0 8px;font-size:1.7rem;font-weight:800}
#end button{font:inherit;font-weight:800;font-size:1.15rem;border:3px solid #3a1f10;border-radius:14px;background:var(--red);color:#fff;padding:10px 22px;cursor:pointer;box-shadow:0 4px 0 #3a1f10;margin-top:8px}
#end button:active{transform:translateY(3px);box-shadow:0 1px 0 #3a1f10}

/* contraste: texto oscuro sobre claro, claro sobre oscuro (WCAG AA) */
#alc .sub{opacity:1;color:#5a3a22}#alc .hint{opacity:1;color:#5a3a22}#alc .nl{color:#4a2e1a}
#alc button:disabled{background:#d9cdb4;color:#4a3a28;border-color:#5a4a38}
#alc button,#intro button{background:#2a7a3a;color:#fff;text-shadow:0 1px 0 #0006}
#alc .next,#info .next,#end button{background:#c42f22;color:#fff}
#alc .rec{background:#a8241a;font-size:.78rem}#alc .rec.ok{background:#1f6a30}
#alc .pin small{background:#fff;color:#2a140a;font-weight:800}
.mb{text-shadow:0 2px 0 #0007}.mb small{opacity:1;font-weight:700}
.mb.green{background:#2a7a3a}.mb.blue{background:#1f5fa8}.mb.purple{background:#6a3bb0}
.mb.orange{background:#f6a53a;color:#2a140a;text-shadow:none}
.credit,#menu .credit{display:inline-block;background:#2a1408dd;color:#fff4dc;border-radius:999px;padding:3px 12px;text-shadow:none;margin:0 auto}
#menu .credit{left:50%;right:auto;transform:translateX(-50%);white-space:nowrap;font-size:.74rem}
#mst{background:#fff4dc;color:#2a140a}
#leg button,.pill{color:#2a140a}
#dep{position:fixed;inset:0;z-index:9;display:none;place-items:start center;padding:14px;background:#2a1408f2;overflow:auto}
#dep .box{background:#fff4dc;color:#2a140a;border:4px solid #3a1f10;border-radius:22px;padding:18px;max-width:1000px;width:100%;box-shadow:0 8px 0 #3a1f10;margin:auto;font-weight:700}
#dep h2{margin:0;font-size:1.7rem;font-weight:800}#dep .sub{margin:2px 0 10px;color:#5a3a22}
#dep h3{margin:14px 0 6px;font-size:1.05rem;letter-spacing:.5px;text-transform:uppercase;color:#5a3a22}
#dep .hh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
#dep .gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
#dep .dc{font:inherit;text-align:left;color:#2a140a;background:#fff;border:3px solid #3a1f10;border-radius:16px;padding:0;cursor:pointer;box-shadow:0 4px 0 #3a1f10;overflow:hidden;display:flex;flex-direction:column;min-height:0}
#dep .dc:active{transform:translateY(3px);box-shadow:0 1px 0 #3a1f10}
#dep .dc.cur{outline:4px solid #f6c344;outline-offset:2px}
#dep .dt{display:flex;align-items:center;gap:8px;padding:8px 12px;color:#fff;text-shadow:0 2px 0 #0008;font-size:1.25rem;font-weight:800;line-height:1.05}
#dep .dt small{display:block;font-size:.78rem;font-weight:700;opacity:1}
#dep .db{padding:8px 12px 10px;font-size:.88rem;font-weight:600;display:flex;flex-direction:column;gap:4px}
#dep .bd{align-self:flex-start;border-radius:999px;padding:0 10px;font-size:.76rem;font-weight:800;background:#e9dcc0;color:#3a2a18}
#dep .bd.ok{background:#1f6a30;color:#fff}#dep .bd.go{background:#f6c344;color:#2a140a}
#dep button.back{font:inherit;font-weight:800;border:3px solid #3a1f10;border-radius:12px;background:#1f5fa8;color:#fff;padding:6px 14px;cursor:pointer;box-shadow:0 3px 0 #3a1f10;min-height:40px;white-space:nowrap}

#news{position:fixed;inset:0;z-index:12;display:none;place-items:start center;padding:12px;background:#000c;overflow:auto}
#news .paper{background:#f4ecd8;color:#1c1408;border:3px solid #1c1408;max-width:820px;width:100%;margin:auto;padding:14px 20px 18px;box-shadow:0 10px 0 #0008;font-family:Georgia,"Times New Roman",serif;animation:npin .7s cubic-bezier(.2,1.3,.4,1) both;background-image:repeating-linear-gradient(0deg,#0000 0 3px,#0000000a 3px 4px)}
@keyframes npin{from{transform:rotate(-14deg) scale(.2);opacity:0}to{transform:none;opacity:1}}
#news .mh{text-align:center;border-bottom:4px double #1c1408;padding-bottom:6px}
#news .mh h2{margin:0;font-size:clamp(1.9rem,7vw,3.1rem);font-weight:900;letter-spacing:1px;font-family:"Old English Text MT","UnifrakturCook",Georgia,serif;line-height:1}
#news .mh small{display:flex;justify-content:space-between;font:700 .72rem/1.2 "Baloo 2",sans-serif;letter-spacing:.5px;text-transform:uppercase;border-top:1px solid #1c1408;margin-top:6px;padding-top:3px}
#news .tag{display:inline-block;background:#1c1408;color:#f4ecd8;font:800 .74rem "Baloo 2",sans-serif;padding:1px 10px;letter-spacing:1px;margin:10px 0 2px;text-transform:uppercase}
#news h3{margin:2px 0 4px;font-size:clamp(1.5rem,5.5vw,2.3rem);line-height:1.02;font-weight:900}
#news .by{font:700 .85rem "Baloo 2",sans-serif;color:#4a3a22;margin-bottom:8px}
#news .bd{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font:600 1rem/1.35 "Baloo 2",sans-serif}
#news .bd p{margin:0 0 6px;text-align:justify}
#news .ph{grid-row:span 2;border:3px solid #1c1408;background:radial-gradient(circle,#e9d7a8,#b99a5a);display:grid;place-items:center;min-height:150px;font-size:5rem;filter:sepia(.5);position:relative}
#news .ph i{position:absolute;bottom:0;left:0;right:0;background:#1c1408cc;color:#f4ecd8;font:700 .72rem "Baloo 2",sans-serif;font-style:normal;padding:2px 6px;text-align:center}
#news .q{border-left:5px solid #1c1408;padding-left:10px;font-style:italic;font-size:1.05rem}#news .q b{display:block;font:800 .8rem "Baloo 2",sans-serif;font-style:normal;margin-top:2px}
#news table{width:100%;border-collapse:collapse;font:700 .92rem "Baloo 2",sans-serif;margin:6px 0 8px;grid-column:1/-1}
#news td,#news th{border-bottom:1px solid #1c140855;padding:3px 6px;text-align:left}#news th{background:#1c1408;color:#f4ecd8;font-size:.78rem;letter-spacing:.5px}
#news tr.me td{background:#f6c344;font-weight:800}
#news .bar{height:9px;background:#d8c9a2;border:1px solid #1c1408;min-width:90px}#news .bar span{display:block;height:100%;background:#1c1408}
#news button.cl{font:800 1.1rem "Baloo 2",sans-serif;border:3px solid #1c1408;border-radius:12px;background:#c42f22;color:#fff;padding:8px 22px;cursor:pointer;box-shadow:0 4px 0 #1c1408;margin-top:8px}
@media(max-width:560px){#news .bd{grid-template-columns:1fr}}
#alc .pin.lm b{background:#f6c344;color:#2a140a;animation:none}
#alc .pin.lm small{background:#2a1408;color:#fff4dc}
#alc .town.g3 .pin:not(.sel):not(.lm) small{display:none}
#alc .town.g3 .pin:hover small,#alc .town.g3 .pin:focus-visible small{display:inline}
#alc .town.g3 .pin:hover{z-index:3}
#alc .town.g3{aspect-ratio:16/10}#alc .box.wide{max-width:1080px}

#elec{position:fixed;inset:0;z-index:11;display:none;place-items:start center;padding:12px;background:#1a0d06f2;overflow:auto}
#elec .box{background:#fff4dc;color:#2a140a;border:4px solid #3a1f10;border-radius:22px;padding:18px;max-width:860px;width:100%;box-shadow:0 8px 0 #3a1f10;margin:auto;font-weight:700}
#elec h2{margin:0;font-size:1.7rem}#elec .sub{margin:2px 0 10px;color:#5a3a22}#elec h4{margin:12px 0 4px;text-transform:uppercase;letter-spacing:.5px;font-size:.9rem;color:#5a3a22}
#elec .vs{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px;align-items:center;text-align:center}
#elec .side b{display:block;font-size:2rem}#elec .side.me b{color:#1f6a30}#elec .side small{font-size:.8rem}
#elec .bar2{position:relative;height:26px;border:3px solid #3a1f10;border-radius:14px;background:#c42f22;overflow:hidden}#elec .bar2 span{position:absolute;left:0;top:0;bottom:0;background:#2a7a3a}
#elec .bar2 u{position:absolute;left:50%;top:0;bottom:0;width:3px;background:#fff}
#elec .eb{display:grid;grid-template-columns:130px 1fr 52px;gap:8px;align-items:center;margin:3px 0;font-size:.92rem}
#elec .eb i{height:12px;border:2px solid #3a1f10;border-radius:8px;background:#e6d7b4;overflow:hidden}#elec .eb i b{display:block;height:100%;background:#2a7a3a;transition:width 1s}
#elec .dg{display:flex;flex-wrap:wrap;gap:5px}#elec .dd{border-radius:999px;padding:1px 9px;font-size:.78rem;border:2px solid #3a1f10}
#elec .vc{margin:6px 0;padding:6px 10px;border-left:6px solid #2a7a3a;background:#fff;border-radius:8px;font-weight:600}#elec .vc.n{border-color:#a8241a}#elec .vc b{display:block;font-size:.82rem}#elec .vc small{display:block;font-size:.74rem;color:#5a3a22;font-weight:600}
#elec .verdict{font-size:1.5rem;text-align:center;margin:12px 0 4px}#elec .verdict.w{color:#1f6a30}#elec .verdict.l{color:#a8241a}
#elec .next{font:inherit;font-weight:800;font-size:1.15rem;border:3px solid #3a1f10;border-radius:14px;background:#c42f22;color:#fff;padding:10px 24px;cursor:pointer;box-shadow:0 4px 0 #3a1f10;display:block;margin:8px auto 0}
#dep .road{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 8px;font-size:.88rem}#dep .road span{background:#e9dcc0;border:2px solid #3a1f10;border-radius:999px;padding:1px 10px;color:#3a2a18}#dep .road span.on{background:#2a7a3a;color:#fff}#dep .road i{font-style:normal;color:#5a3a22}
#dep .nat{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 6px;align-items:center}#dep .nat small{color:#5a3a22;font-weight:700}
#dep .nat .next{font:inherit;font-weight:800;border:3px solid #3a1f10;border-radius:12px;background:#c42f22;color:#fff;padding:8px 16px;cursor:pointer;box-shadow:0 3px 0 #3a1f10}
#alc .fw{font-size:2.6rem;animation:pul 1s infinite}
@media(max-width:560px){#elec .vs{grid-template-columns:1fr}#elec .eb{grid-template-columns:100px 1fr 44px}}
#alc .hl{background:#1c1408;color:#f4ecd8;border-radius:12px;padding:8px 14px 9px;margin:-4px 0 10px;border:3px solid #3a1f10;animation:hlin .6s cubic-bezier(.2,1.3,.4,1) both;font-family:Georgia,"Times New Roman",serif}
#alc .hl .st{display:inline-block;background:#c42f22;color:#fff;font:800 .7rem "Baloo 2",sans-serif;letter-spacing:1px;padding:0 9px;border-radius:999px;margin-bottom:3px}
#alc .hl b{display:block;font-size:clamp(1.05rem,3.6vw,1.45rem);line-height:1.1;font-weight:900}
